<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Aniello Mollo">
  <title>Aniello Mollo — Cloud Engineer</title>
  <defs>
    <linearGradient id="am-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b45ff"/>
      <stop offset="0.55" stop-color="#5b2ee5"/>
      <stop offset="1" stop-color="#3a1bb0"/>
    </linearGradient>
    <linearGradient id="am-orbit" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a1f"/>
      <stop offset="1" stop-color="#ffb877"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="18" fill="url(#am-tile)"/>

  <!-- Orbita: il progetto ruota attorno alla lettera, non le sta dietro -->
  <ellipse cx="32" cy="34" rx="25" ry="11.5"
           transform="rotate(-27 32 34)"
           fill="none" stroke="url(#am-orbit)" stroke-width="3.4" opacity="0.95"/>

  <!-- A: risalita, la forma portante -->
  <path d="M18 45 L32 17 L46 45" fill="none" stroke="#ffffff"
        stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24.5 34.5 H39.5" fill="none" stroke="#ffffff"
        stroke-width="5.2" stroke-linecap="round"/>

  <!-- Nodo: il satellite sull'orbita -->
  <circle cx="50.5" cy="24" r="4.6" fill="#ff7a1f" stroke="#170f3d" stroke-width="2"/>
</svg>
