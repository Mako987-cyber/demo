<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Space Invaders - Edizione vaporwave con neon, synth e tramonti digitali" />
  <title>Space Invaders</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="../../favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#5b2ee5" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=cabinet-grotesk@500,700,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/base.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <link rel="stylesheet" href="../../styles/layout.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="site-header" data-header>
    <div class="container navbar">
      <a class="brand" href="../../index.html" aria-label="Home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <ellipse cx="16" cy="17" rx="12.4" ry="5.5" transform="rotate(-27 16 17)"
                     stroke="var(--color-accent-soft)" stroke-width="1.7" opacity="0.95"/>
            <path d="M8.2 23.4 16 8.6 23.8 23.4" stroke="currentColor" stroke-width="2.6"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M11.8 17.8h8.4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
            <circle cx="25.4" cy="10.8" r="2.5" fill="var(--color-accent-soft)"/>
          </svg>
        </span>
        <span class="brand__text">Space Invaders</span>
      </a>

      <a href="../projects.html" class="btn btn--secondary back-projects">← Progetti</a>
    </div>
  </header>

  <main id="main-content">
    <section class="game-container">
      <div class="game-header">
        <p class="game-subtitle">Neon Arcade Transmission</p>
        <h1>SPACE INVADERS // VAPORWAVE</h1>
      </div>

      <div class="game-stats">
        <div>SCORE: <span id="score">0</span></div>
        <div>VITE: <span id="lives">3</span></div>
        <div>LIVELLO: <span id="level">1</span></div>
      </div>

      <canvas id="gameCanvas" width="800" height="600"></canvas>

      <div id="gameOverMessage" class="game-over" style="display: none;"></div>

      <div class="button-row">
        <button class="btn-game" onclick="gameState.start()">NUOVA PARTITA</button>
        <button class="btn-game" onclick="gameState.togglePause()">PAUSA</button>
      </div>

      <div class="game-controls">
        <h3>COMANDI</h3>
        <ul class="controls-list">
          <li>← → : Muovi astronave</li>
          <li>SPAZIO: Spara</li>
          <li>P: Pausa</li>
          <li>WASD: Movimento alternativo</li>
        </ul>
      </div>

      <div style="text-align: center; margin-top: 2rem;">
        <a href="../projects.html" class="back-link">← TORNA AI PROGETTI</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer__inner">
      <span>Space Invaders Vaporwave</span>
      <span>Neon Skyline · Synth Arcade · Estate Digitale</span>
    </div>
  </footer>

  <script src="../../scripts/main.js" defer></script>
  <script src="./script.js" defer></script>
</body>
</html>
