<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Meteo &amp; Previsioni — meteo corrente e previsioni a 7 giorni per qualsiasi città, con dettaglio orario. Un progetto di Aniello Mollo." />
  <title>Meteo &amp; Previsioni · Progetti di Aniello Mollo</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=cabinet-grotesk@500,700,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <link rel="stylesheet" href="/styles/layout.css" />
  <link rel="stylesheet" href="/pages/weather/style.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Salta al contenuto</a>

  <header class="site-header" data-header>
    <div class="container navbar">
      <a class="brand" href="/" aria-label="Home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <g stroke="currentColor" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 45 L23.5 19 L34 45 L34 19 L42 31 L50 19 L50 45"/>
              <path d="M17.6 34.5 H29.4"/>
            </g>
          </svg>
        </span>
        <span class="brand__text">Aniello Mollo</span>
      </a>

      <nav class="site-nav" aria-label="Navigazione principale">
        <button class="icon-button nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu" data-nav-toggle>
          <span class="sr-only">Apri menu</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="nav-menu" id="nav-menu" data-nav-menu>
          <a href="/">Home</a>
          <a href="/pages/portfolio/services.html">Servizi</a>
          <a href="/pages/projects.html" class="is-active" aria-current="page">Progetti</a>
          <a href="/pages/portfolio/profile.html">Profilo</a>
          <a class="btn btn--primary btn--nav" href="/pages/portfolio/contact.html">Contatti</a>
        </div>
      </nav>

      <button class="icon-button" type="button" aria-label="Cambia tema" data-theme-toggle>
        <span data-theme-icon aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main id="main-content">
    <section class="section">
      <div class="container weather-container">
        <a href="/pages/projects.html" class="back-link">&larr; Torna ai Progetti</a>

        <div class="search-section reveal">
          <h1>Meteo &amp; Previsioni</h1>
          <p style="color: var(--color-text-secondary); margin-bottom: 2rem;">
            Cerca una città per visualizzare il meteo corrente e le previsioni dei prossimi 7 giorni.
          </p>

          <div class="search-wrapper">
            <input
              type="text"
              id="city"
              class="search-input"
              placeholder="Milano, Roma, Londra..."
              autocomplete="off"
            />
            <button class="search-button" id="load">Cerca</button>
          </div>
        </div>

        <div id="weather-output"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer__inner">
      <span>Meteo &amp; Previsioni</span>
      <span>Dati da Open-Meteo API &middot; Aggiornamento in tempo reale</span>
    </div>
  </footer>

  <script src="/scripts/main.js" defer></script>
  <script src="/pages/api/http.js" defer></script>
  <script src="/pages/api/weatherApi.js" defer></script>
  <script src="/pages/weather/script.js" defer></script>
</body>
</html>
